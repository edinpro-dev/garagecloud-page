name = "jedox-waiting-list"
compatibility_date = "2024-01-01"
# Static site, plus one route: worker/index.ts relays the waiting-list form.
main = "worker/index.ts"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
# Only the form endpoint reaches the Worker; every page is served straight
# from the static assets.
run_worker_first = ["/api/*"]

[[routes]]
pattern = "garagecloud.uk"
custom_domain = true

[[routes]]
pattern = "garagecloud.co"
custom_domain = true

[[routes]]
pattern = "garage-cloud.co.uk"
custom_domain = true


